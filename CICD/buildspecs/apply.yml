version: 0.2

# Stage final de ambos pipelines: terraform apply usando el plan generado en el stage
# anterior (artifact "tfplan"). En "develop" se ejecuta automáticamente; en "main" solo
# se llega aquí tras la Manual Approval.
#
# El backend S3 (state) vive en la cuenta del PIPELINE; los recursos desplegados viven en
# la cuenta DESTINO. Las credenciales de CodeBuild se usan tal cual para `terraform init`
# (acceso al backend); el cambio de cuenta para los recursos lo hace el provider "aws" de
# environments/* vía `assume_role` (ver environments/*/providers.tf).
#
# IMPORTANTE: target_role_arn debe pasarse con el MISMO valor que en el plan (plan.yml),
# porque el plan guardado (tfplan) fija ya las referencias del provider; si cambiara el
# rol asumido entre plan y apply, Terraform fallaría al reconciliar el plan.
#
# Variables de entorno esperadas (inyectadas por el proyecto CodeBuild, ver codebuild.tf):
#   PROJECT_NAME       - nombre del proyecto (para las rutas SSM)
#   ENVIRONMENT        - "dev" o "main", según la rama que disparó el pipeline
#   TERRAFORM_VERSION  - versión de Terraform a instalar

phases:
  install:
    commands:
      - echo "Instalando Terraform ${TERRAFORM_VERSION}"
      - curl -sO "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
      - unzip -o "terraform_${TERRAFORM_VERSION}_linux_amd64.zip" -d /usr/local/bin
      - terraform -version

  pre_build:
    commands:
      - echo "Leyendo configuración del entorno ${ENVIRONMENT} desde SSM"
      - TF_STATE_BUCKET=$(aws ssm get-parameter --name "/${PROJECT_NAME}/tf_state_bucket" --query 'Parameter.Value' --output text)
      - TF_STATE_LOCK_TABLE=$(aws ssm get-parameter --name "/${PROJECT_NAME}/tf_state_lock_table" --query 'Parameter.Value' --output text)

  build:
    commands:
      - cd "CICD/environments/${ENVIRONMENT}"
      - echo "terraform init"
      - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=environments/${ENVIRONMENT}/terraform.tfstate" -backend-config="region=${AWS_DEFAULT_REGION}" -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}"
      - echo "terraform apply (usando el plan generado en el stage anterior)"
      - terraform apply -input=false -auto-approve tfplan

  post_build:
    commands:
      - echo "Apply completado para el entorno ${ENVIRONMENT}"
