version: 0.2

# Stage 3 de ambos pipelines: terraform init + plan contra la cuenta destino del entorno.
#
# El backend S3 (state) vive en la cuenta del PIPELINE; los recursos desplegados viven en
# la cuenta DESTINO. Por eso las credenciales de CodeBuild (cuenta pipeline) se usan tal
# cual para `terraform init` (acceso al backend), y el cambio de cuenta para los recursos
# lo hace el propio provider "aws" de environments/* vía `assume_role` (ver
# environments/*/providers.tf), pasando target_role_arn como variable de Terraform. Así
# nunca se pisan las credenciales de shell con un assume-role manual.
#
# Variables de entorno esperadas (inyectadas por el proyecto CodeBuild, ver codebuild.tf):
#   PROJECT_NAME       - nombre del proyecto (para las rutas SSM)
#   ENVIRONMENT        - "dev" o "main", según la rama que disparó el pipeline
#   TERRAFORM_VERSION  - versión de Terraform a instalar

phases:
  install:
    commands:
      - echo "Instalando Terraform ${TERRAFORM_VERSION}"
      - curl -sO "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
      - unzip -o "terraform_${TERRAFORM_VERSION}_linux_amd64.zip" -d /usr/local/bin
      - terraform -version

  pre_build:
    commands:
      - echo "Leyendo configuración del entorno ${ENVIRONMENT} desde SSM"
      - TF_STATE_BUCKET=$(aws ssm get-parameter --name "/${PROJECT_NAME}/tf_state_bucket" --query 'Parameter.Value' --output text)
      - TF_STATE_LOCK_TABLE=$(aws ssm get-parameter --name "/${PROJECT_NAME}/tf_state_lock_table" --query 'Parameter.Value' --output text)
      - TARGET_ROLE_ARN=$(aws ssm get-parameter --name "/${PROJECT_NAME}/${ENVIRONMENT}/target_role_arn" --query 'Parameter.Value' --output text)
      - test -n "$TARGET_ROLE_ARN" -a "$TARGET_ROLE_ARN" != "None" || (echo "ERROR - no existe el parametro SSM /${PROJECT_NAME}/${ENVIRONMENT}/target_role_arn. Ejecuta scripts/set-cross-account-target.sh para definirlo y vuelve a aplicar pipeline/." && exit 1)

  build:
    commands:
      - cd "CICD/environments/${ENVIRONMENT}"
      - echo "terraform init"
      - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=environments/${ENVIRONMENT}/terraform.tfstate" -backend-config="region=${AWS_DEFAULT_REGION}" -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}"
      - echo "terraform plan"
      - terraform plan -input=false -var="project_name=${PROJECT_NAME}" -var="target_role_arn=${TARGET_ROLE_ARN}" -out=tfplan
      - terraform show -no-color tfplan > tfplan.txt

  post_build:
    commands:
      - echo "Plan generado para el entorno ${ENVIRONMENT}"

artifacts:
  base-directory: CICD/environments/${ENVIRONMENT}
  files:
    - tfplan
    - tfplan.txt
    - '**/*'
